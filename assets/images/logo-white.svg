<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <defs>
    <linearGradient id="logoGradientWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00b894"/>
      <stop offset="100%" style="stop-color:#00d9a5"/>
    </linearGradient>
  </defs>

  <!-- Medical Cross Icon with Circle -->
  <circle cx="30" cy="30" r="28" fill="url(#logoGradientWhite)"/>
  <rect x="22" y="12" width="16" height="36" rx="2" fill="white"/>
  <rect x="12" y="22" width="36" height="16" rx="2" fill="white"/>

  <!-- Small orbit circles for "Cosmic" theme -->
  <ellipse cx="30" cy="30" rx="26" ry="10" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1" transform="rotate(-30 30 30)"/>
  <circle cx="52" cy="20" r="3" fill="white"/>

  <!-- Company Name - White for dark backgrounds -->
  <text x="70" y="28" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="white">COSMIC</text>
  <text x="70" y="48" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#00d9a5">SURGICALS</text>

  <!-- Tagline underline -->
  <rect x="70" y="52" width="100" height="2" rx="1" fill="url(#logoGradientWhite)"/>
</svg>

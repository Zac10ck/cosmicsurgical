<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80">
  <defs>
    <linearGradient id="cosmicGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0099CC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#006699;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pulseGradientDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:0.3" />
    </linearGradient>
    <filter id="glowDark">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Orbit rings -->
  <ellipse cx="40" cy="40" rx="28" ry="12" fill="none" stroke="url(#cosmicGradientDark)" stroke-width="1.5" transform="rotate(-20 40 40)" opacity="0.6">
    <animateTransform attributeName="transform" type="rotate" from="-20 40 40" to="340 40 40" dur="20s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="40" cy="40" rx="28" ry="12" fill="none" stroke="url(#cosmicGradientDark)" stroke-width="1.5" transform="rotate(40 40 40)" opacity="0.6">
    <animateTransform attributeName="transform" type="rotate" from="40 40 40" to="400 40 40" dur="25s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="40" cy="40" rx="28" ry="12" fill="none" stroke="url(#cosmicGradientDark)" stroke-width="1.5" transform="rotate(100 40 40)" opacity="0.6">
    <animateTransform attributeName="transform" type="rotate" from="100 40 40" to="460 40 40" dur="30s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Center medical cross with heartbeat -->
  <g filter="url(#glowDark)">
    <!-- Outer circle -->
    <circle cx="40" cy="40" r="18" fill="url(#cosmicGradientDark)" opacity="0.15">
      <animate attributeName="r" values="18;20;18" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- Inner circle -->
    <circle cx="40" cy="40" r="15" fill="#ffffff"/>
    <!-- Medical cross -->
    <rect x="36" y="30" width="8" height="20" rx="2" fill="url(#cosmicGradientDark)"/>
    <rect x="30" y="36" width="20" height="8" rx="2" fill="url(#cosmicGradientDark)"/>
  </g>

  <!-- Orbiting particles -->
  <circle r="3" fill="#00D4FF" filter="url(#glowDark)">
    <animateMotion dur="6s" repeatCount="indefinite">
      <mpath href="#orbit1d"/>
    </animateMotion>
  </circle>
  <path id="orbit1d" d="M 12,40 A 28,12 -20 1,1 68,40 A 28,12 -20 1,1 12,40" fill="none"/>

  <circle r="2" fill="#00D4FF" filter="url(#glowDark)">
    <animateMotion dur="8s" repeatCount="indefinite">
      <mpath href="#orbit2d"/>
    </animateMotion>
  </circle>
  <path id="orbit2d" d="M 12,40 A 28,12 40 1,1 68,40 A 28,12 40 1,1 12,40" fill="none"/>

  <!-- Company Name -->
  <text x="80" y="35" font-family="'Poppins', sans-serif" font-size="26" font-weight="700" fill="#0a1628" letter-spacing="1">
    COSMIC
  </text>
  <text x="80" y="58" font-family="'Poppins', sans-serif" font-size="14" font-weight="500" fill="url(#cosmicGradientDark)" letter-spacing="3">
    SURGICALS
  </text>

  <!-- Heartbeat line accent -->
  <path d="M 200 45 L 210 45 L 215 35 L 220 55 L 225 40 L 230 45 L 240 45"
        stroke="url(#pulseGradientDark)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="stroke-dasharray" values="0,100;50,50;100,0" dur="2s" repeatCount="indefinite"/>
  </path>
</svg>